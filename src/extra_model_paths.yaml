comfyui:
  base_path: /runpod-volume
  is_default: true
  checkpoints: models/checkpoints/
  clip: models/text_encoders/
  clip_vision: models/clip_vision/
  configs: models/configs/
  controlnet: models/controlnet/
  diffusion_models: models/diffusion_models/
  unet_gguf: models/diffusion_models/
  unet: models/unet/
  vae: models/vae/
  loras: models/loras/
  upscale_models: models/upscale_models/
  # custom_nodes/input/output must exist at runtime — start.sh creates them
  # (ComfyUI main.py execute_prestartup_script does os.listdir(custom_nodes) and crashes if missing)
  custom_nodes: custom_nodes/
  input: input/
  output: output/
  embeddings: models/embeddings/
